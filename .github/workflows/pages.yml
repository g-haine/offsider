name: Deploy Hugo site to Pages

env:
  HUGO_VERSION: 0.168.0
  NODE_VERSION: 24.21.0
  BIBREVIEW_COMMIT: 89e9c616962d42565e35c2f82ec8ba7c2568085d

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned BibReview
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "git+https://github.com/g-haine/bibreview.git@${BIBREVIEW_COMMIT}"

      - name: Verify pinned BibReview
        run: |
          python - <<'PY'
          import importlib.metadata
          import json
          import os

          expected = os.environ["BIBREVIEW_COMMIT"]
          distribution = importlib.metadata.distribution("bibreview")
          raw = distribution.read_text("direct_url.json")
          if not raw:
              raise SystemExit("BibReview installation has no direct_url.json")
          installed = json.loads(raw).get("vcs_info", {}).get("commit_id", "")
          if installed != expected:
              raise SystemExit(
                  f"BibReview commit mismatch: expected {expected}, installed {installed}"
              )
          print(f"BibReview commit: {installed}")
          PY

      - name: Verify generated bibliography site artifacts
        run: |
          bibreview render
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          curl -sfL \
            -o "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -C "${RUNNER_TEMP}/hugo" -xf "${RUNNER_TEMP}/hugo.tar.gz"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Build Hugo site
        run: |
          hugo \
            --source site \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build Pagefind search index
        run: |
          npx --yes pagefind@1.5.2 --site site/public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
