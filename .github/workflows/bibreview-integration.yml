name: BibReview integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned BibReview
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/g-haine/bibreview.git@12c7d1bf86971aa89cdd37035aac47c2f38b467f"

      - name: Verify pinned BibReview
        run: |
          test "$(bibreview --version)" = "bibreview 1.7.1"

      - name: Validate configuration
        run: bibreview validate

      - name: Show resolved project status
        run: bibreview status
