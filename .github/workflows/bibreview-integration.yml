name: BibReview integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned BibReview
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/g-haine/bibreview.git@9c9c69b167a3575dfec4c2eafff4b5d791de96b5"

      - name: Verify pinned BibReview
        run: |
          test "$(bibreview --version)" = "bibreview 1.7.1"

      - name: Validate configuration
        run: bibreview validate

      - name: Show resolved project status
        run: bibreview status

      - name: Verify discovery query is configured
        run: |
          if bibreview status | grep -F "(no query)"; then
            echo "Discovery query is unexpectedly missing." >&2
            exit 1
          fi
