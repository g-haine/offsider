name: BibReview integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned BibReview
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/g-haine/bibreview.git@ba80285c35c5cdecc4d025378d3da98a97c9f5cf"

      - name: Verify pinned BibReview
        run: |
          test "$(bibreview --version)" = "bibreview 1.7.1"
          python - <<'PY'
          import importlib.metadata
          import json

          expected = "ba80285c35c5cdecc4d025378d3da98a97c9f5cf"
          distribution = importlib.metadata.distribution("bibreview")
          raw = distribution.read_text("direct_url.json")
          if not raw:
              raise SystemExit("BibReview installation has no direct_url.json")
          installed = json.loads(raw).get("vcs_info", {}).get("commit_id", "")
          if installed != expected:
              raise SystemExit(
                  f"BibReview commit mismatch: expected {expected}, installed {installed}"
              )
          print(f"BibReview commit: {installed}")
          PY

      - name: Validate configuration
        run: bibreview validate

      - name: Show resolved project status
        run: bibreview status

      - name: Verify provider cache policy
        run: |
          bibreview status | grep -F "Provider cache: enabled (6h TTL)"

      - name: Verify discovery query is configured
        run: |
          if bibreview status | grep -F "(no query)"; then
            echo "Discovery query is unexpectedly missing." >&2
            exit 1
          fi
