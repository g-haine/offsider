schema_version: 1

environment:
  file: .env

project:
  name: of.FSI.der
  slug: offsider
  title: of.FSI.der
  repository: https://github.com/g-haine/offsider

paths:
  bibliography: data/bibliography.json
  collected: data/collected.json
  author_mappings: data/author_mappings.json
  known: data/ID.txt
  pending: data/newID.txt
  rejected: data/badID.txt
  review: data/checkID.txt
  bibtex: bib
  imports: data/imports
  archive: archive
  site: site

# Precision-first discovery strategy derived from docs/scope.md and
# docs/discovery.md. Application-domain exclusions are intentionally not encoded
# here; ambiguous candidates are sent to manual review instead.
discovery:
  provider: openalex
  search_field: title
  query: >-
    (
      (
        "fluid structure interaction"
        OR "fluid structure system"
        OR "fluid structure model"
        OR "fluid structure coupling"
        OR "fluid solid interaction"
        OR "fluid solid coupling"
        OR "fluid rigid body interaction"
        OR "fluid rigid body coupling"
        OR "interaction fluide structure"
      )
      AND
      (
        existence
        OR uniqueness
        OR solvability
        OR "well posed"
        OR regularity
        OR "strong solution"
        OR "weak solution"
        OR stabilization
        OR stabilisation
        OR controllability
        OR "feedback control"
        OR convergence
        OR discretization
        OR discretisation
        OR "error estimate"
        OR "finite element"
        OR "numerical analysis"
        OR "Navier Stokes"
        OR Lame
        OR Lamé
        OR variational
        OR partitioned
        OR monolithic
        OR "added mass"
        OR "time stepping"
        OR "port Hamiltonian"
        OR "structure preserving"
        OR "energy preserving"
        OR "arbitrary Lagrangian Eulerian"
        OR "Lagrange Galerkin"
      )
    )
    OR ("piston problem" AND fluid)
  max_pages: 20
  accepted_types:
    - journal-article
    - proceedings-article
    - book-chapter
    - book
    - monograph
    - dissertation
  exclude_doi_substrings:
    - arxiv
    - zenodo
    - 10.21203/rs.3.rs

initialization:
  campaign: audit/init/campaign.json
  report: audit/init/report.json
  batch_size: 10

relevance:
  patterns:
    - '(?is)(?=.*\bfluid[-\s]+(?:structure|solid)(?:s)?(?:[-\s]+interaction(?:s)?|[-\s]+system(?:s)?|[-\s]+model(?:s)?|[-\s]+coupl(?:e|ed|ing))\b)(?=.*\b(?:well[-\s]+posed(?:ness)?|existence(?:[-\s]+for|\s+(?:and\s+uniqueness|of\s+(?:(?:weak|strong|global|local)\s+)?solutions?))|uniqueness(?:\s+of\s+solutions?)?|regularity(?:\s+results?)?|(?:weak|strong)[-\s]+solutions?|stabili[sz](?:ation|ability)|controllability|feedback[-\s]+control|optimal[-\s]+control|energy[-\s]+estimate|convergence[-\s]+analysis|error[-\s]+estimate|port[-\s]+Hamiltonian|structure[-\s]+preserving|energy[-\s]+preserving)\b)'
    - '(?is)\A(?=.{0,220}\b(?:fluid[-\s]+(?:structure|solid)(?:s)?(?:[-\s]+interaction(?:s)?|[-\s]+coupl(?:e|ed|ing))|fluid[-\s]+and[-\s]+structural[-\s]+dynamics)\b)(?=.{0,180}\b(?:solver|coupling[-\s]+methods?|(?:mixed[-\s]+)?formulations?|partitioned[-\s]+semi[-\s]+implicit|partitioned[-\s]+(?:coupling[-\s]+)?(?:scheme|method)|monolithic[-\s]+(?:fictitious[-\s]+domain[-\s]+)?(?:scheme|method)|fictitious[-\s]+domain[-\s]+method|topology[-\s]+optimization|time[-\s]+integration[-\s]+schemes?|direct[-\s]+adjoint|cut[-\s]+cell|discrete[-\s]+velocity|hybrid[-\s]+strongly[-\s]+coupled|graph[-\s]+attention[-\s]+solver|multi[-\s]+grid.{0,60}\bmethod|finite[-\s]+element[-\s]+discontinuous[-\s]+galerkin[-\s]+method|lattice[-\s]+boltzmann.{0,40}\bmethod|spectral[-\s]+element[-\s]+solver|immersed[-\s]+finite[-\s]+element[-\s]+method)\b)'
    - '(?is)\A(?=.{0,220}\b(?:fluid[-\s]+(?:structure|solid)(?:s)?(?:[-\s]+interaction(?:s)?|[-\s]+coupl(?:e|ed|ing))|fluid[-\s]+and[-\s]+structural[-\s]+dynamics)\b)(?=.{0,180}\b(?:model[-\s]+predictive[-\s]+control|modeling[-\s]+and[-\s]+controls?|active[-\s]+control|feedback[-\s]+control|optimal[-\s]+control)\b)'
    - '(?is)(?=.*\bfluid[-\s]+structure[-\s]+model\b)(?=.*\bNavier[-\s]+Stokes\b)(?=.*\bLam(?:e|é)\b)'
    - '(?is)(?=.*\bpiston[-\s]+problem\b)(?=.*\b(?:fluid[-\s]+structure|moving[-\s]+piston|mass[-\s]+spring)\b)'
  reject_patterns:
    - '(?is)\bsoil[-\s]+fluid[-\s]+structure\b'
    - '(?is)\A(?=.{0,220}\bhigh[-\s]+arch[-\s]+dam\b)'
    - '(?is)\A(?=.{0,220}\bnanoparticle[-\s]+suspensions?\b)'
    - '(?is)\A(?=.{0,220}\bhydraulic[-\s]+engine[-\s]+mount\b)'
    - '(?is)\A(?=.{0,220}\b(?:jamming[-\s]+mechanisms?|control[-\s]+valves?)\b)(?=.*\bthermo[-\s]+fluid[-\s]+structure\b)'
    - '(?is)\A(?=.*\bbio[-\s]+inspired\b)(?=.*\bthermal[-\s]+transport\b)(?=.*\b(?:review|strategies)\b)'
    - '(?is)\A(?=.{0,220}\blow[-\s]+rise[-\s]+buildings?\b)(?=.{0,220}\bspoilers?\b)'
    - '(?is)\A(?=.{0,220}\bseismic[-\s]+vulnerability\b)(?=.{0,220}\b(?:LNG|storage[-\s]+tanks?)\b)'
    - '(?is)\A(?=.{0,220}\bsloshing[-\s]+mitigation\b)(?=.{0,220}\bbaffle[-\s]+flexibility\b)'
  unmatched: manual-review

providers:
  crossref:
    enabled: true
    min_interval_seconds: 0.5

  openalex:
    enabled: true
    min_interval_seconds: 0.5
    api_key_env: OPENALEX_API_KEY

site:
  enabled: false
