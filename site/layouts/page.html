{{ define "main" }}
<article class="post"
  {{ if eq .Section "publications" }}data-pagefind-body{{ end }}>

  {{ if eq .Section "publications" }}
    <span data-pagefind-meta="authors:{{ delimit .Params.authors ", " }}" hidden></span>
    <span data-pagefind-meta="year:{{ .Params.year }}" hidden></span>
    <span data-pagefind-meta="collection:{{ .Params.publication_type }}" hidden></span>
  {{ end }}

  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>

    {{ if eq .Section "publications" }}
      <p class="post-meta">
        {{ .Params.year }}
        {{ with .Params.authors }} -- {{ delimit . ", " }}{{ end }}
      </p>
    {{ end }}
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
