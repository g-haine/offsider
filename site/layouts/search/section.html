{{ define "main" }}
<h1>Search</h1>

<p>
  Search the of.FSI.der publication corpus by title, author, abstract, keyword,
  journal, DOI, or cited reference. Results are generated entirely in your
  browser; no query is sent to a server.
</p>

<link rel="stylesheet"
      href="{{ "pagefind/pagefind-component-ui.css" | relURL }}">

<script src="{{ "pagefind/pagefind-component-ui.js" | relURL }}"
        type="module"></script>

<pagefind-config
  base-url="{{ site.Home.RelPermalink }}"
  bundle-path="{{ "pagefind/" | relURL }}"
  excerpt-length="40">
</pagefind-config>

<pagefind-input placeholder="Search publications…"></pagefind-input>

<pagefind-summary></pagefind-summary>

<pagefind-results
  class="phraise-search-results"
  hide-sub-results
  max-results="50">

  <script type="text/pagefind-template">
    <li class="phraise-search-result">
      <h3>
        <a class="post-link" href="{{`{{ url | safeUrl }}`}}">
          {{`{{ meta.title }}`}}
        </a>
      </h3>

      <p class="post-meta">
        {{`{{#if meta.authors}}{{ meta.authors }}{{/if}}`}}
        {{`{{#if meta.year}} — {{ meta.year }}{{/if}}`}}
      </p>

      <p class="phraise-search-excerpt">
        {{`{{+ excerpt +}}`}}
      </p>
    </li>
  </script>
</pagefind-results>
{{ end }}
